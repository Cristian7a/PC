<div
  id="gallery"
  class="scroll-mt-20 md:scroll-mt-28 relative flex flex-col items-center justify-center w-full px-6 py-2 md:py-4 2xl:py-8 mx-auto max-w-[2000px] sm:px-12 md:px-16 lg:px-24 z-10"
>
  <div
    #animHeader
    class="relative z-10 flex flex-col items-center w-full max-w-3xl mx-auto mb-10 opacity-0 md:mb-12 2xl:mb-16"
    pAnimateOnScroll
    enterClass="animate-fade-in-up"
    (animationstart)="animHeader.classList.remove('opacity-0')"
  >
    <h2
      class="text-3xl font-light text-center tracking-tight text-gold-shine md:text-5xl 2xl:text-7xl"
    >
      {{ 'gallery.title' | translate }}
    </h2>
    <div
      class="w-24 md:w-32 h-[1px] mt-4 bg-gradient-to-r from-transparent via-[var(--p-primary-500)] to-transparent opacity-80"
    ></div>
    <span
      class="mt-4 mb-6 text-[10px] font-bold text-center uppercase tracking-[0.4em] text-silver-shine md:text-xs 2xl:text-sm"
    >
      {{ 'gallery.subtitle' | translate }}
    </span>
    <p
      class="text-sm font-light leading-relaxed text-center text-gray-600 max-w-2xl dark:text-gray-400 md:text-base 2xl:text-xl"
    >
      {{ 'gallery.description' | translate }}
    </p>
  </div>

  <div
    class="relative z-10 w-full px-2 md:px-6 lg:px-10 grid grid-cols-2 md:grid-cols-4 grid-flow-dense auto-rows-[160px] sm:auto-rows-[180px] md:auto-rows-[220px] 2xl:auto-rows-[280px] gap-3 md:gap-4 2xl:gap-6"
  >
    @for (img of galleryImages; track img.src; let i = $index) {
      <div
        #animImg
        class="relative w-full h-full opacity-0 rounded-[1.5rem] md:rounded-[2rem] overflow-hidden group shadow-md hover:shadow-2xl transition-shadow duration-500 bg-gray-100 dark:bg-neutral-900 cursor-pointer focus:outline-none focus:ring-4 focus:ring-[var(--p-primary-500)]/50"
        pAnimateOnScroll
        enterClass="animate-fade-in-up"
        [ngClass]="img.spanClass"
        [style.animation-delay]="i * 100 + 'ms'"
        (animationstart)="animImg.classList.remove('opacity-0')"
        (animationend)="animImg.style.animationDelay = '0ms'"
        tabindex="0"
        (click)="openViewer(i)"
        (keydown.enter)="openViewer(i)"
        (keydown.space)="openViewer(i); $event.preventDefault()"
      >
        <img
          fill
          sizes="(max-width: 768px) 100vw, 50vw"
          class="object-cover transition-transform duration-[2s] ease-out group-hover:scale-110"
          [ngSrc]="img.src"
          [alt]="img.alt"
        />

        <div
          class="absolute inset-0 z-10 flex items-center justify-center transition-all duration-500 opacity-0 bg-black/30 backdrop-blur-[2px] group-hover:opacity-100 pointer-events-none"
        >
          <div
            class="flex items-center justify-center w-12 h-12 transition-transform duration-500 transform scale-75 rounded-full md:w-16 md:h-16 bg-white/20 backdrop-blur-xl border border-white/40 shadow-2xl group-hover:scale-100"
          >
            <i class="text-lg md:text-2xl text-white drop-shadow-md pi pi-expand"></i>
          </div>
        </div>
        <div
          class="absolute inset-0 z-20 transition-colors duration-500 border pointer-events-none rounded-[1.5rem] md:rounded-[2rem] border-white/20 dark:border-white/5 group-hover:border-[#e2c87d]/50"
        ></div>
      </div>
    }
  </div>

  <div
    #animBtn
    class="mt-14 md:mt-16 2xl:mt-20 opacity-0"
    pAnimateOnScroll
    enterClass="animate-fade-in-up"
    [style.animation-delay]="'300ms'"
    (animationstart)="animBtn.classList.remove('opacity-0')"
  >
    <p-button
      variant="outlined"
      styleClass="!rounded-[1.5rem] !px-8 !py-3 md:!px-10 md:!py-4 !bg-gradient-to-br !from-white !via-[var(--p-primary-50)]/20 !to-[var(--p-primary-100)]/70 !backdrop-blur-2xl !border !border-gray-300/80 !text-[var(--p-primary-700)] dark:!from-black/95 dark:!via-neutral-950/90 dark:!to-[var(--p-primary-900)]/10 dark:!border-neutral-700/80 dark:!text-gold-shine transition-all duration-500 hover:-translate-y-1 hover:shadow-[0_15px_30px_rgba(226,200,125,0.15)] font-bold text-sm md:text-base group/btn"
      (onClick)="fullGalleryVisible.set(true)"
    >
      <div class="flex items-center gap-3">
        <span>{{ 'gallery.view_more' | translate }}</span>
        <i class="pi pi-images transition-transform duration-300 group-hover/btn:scale-110"></i>
      </div>
    </p-button>
  </div>
</div>

<p-galleria
  [value]="galleryImages"
  [fullScreen]="true"
  [showItemNavigators]="true"
  [showThumbnails]="false"
  [circular]="true"
  [(visible)]="galleriaVisible"
  [(activeIndex)]="activeIndex"
>
  <ng-template let-item pTemplate="item">
    <img
      class="block w-auto h-auto max-w-[95vw] max-h-[85vh] rounded-md shadow-[0_20px_50px_rgba(0,0,0,0.9)]"
      [src]="item.src"
      [alt]="item.alt"
    />
  </ng-template>
</p-galleria>

<app-full-gallery [visible]="fullGalleryVisible()" (onClose)="fullGalleryVisible.set(false)" />
