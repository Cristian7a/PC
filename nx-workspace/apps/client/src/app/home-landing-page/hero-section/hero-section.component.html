<section
  class="relative flex items-center min-h-screen overflow-hidden transition-colors duration-500 bg-[var(--p-surface-0)] dark:bg-[var(--p-surface-950)]"
>
  <div id="home" class="absolute -top-28 left-0 w-full h-0 pointer-events-none"></div>

  <div class="absolute inset-0 hidden pointer-events-none dark:block">
    <div class="absolute flex flex-col gap-0 -translate-y-1/2 opacity-80 diamond-pos-left top-1/2">
      <div class="diamond anim-float"></div>
      <div class="diamond -mt-16 anim-float-delayed"></div>
      <div class="diamond -mt-16 anim-float"></div>
      <div class="diamond -mt-16 anim-float-delayed"></div>
    </div>
    <div class="absolute flex gap-4 opacity-80 diamond-pos-right diamond-pos-top">
      <div class="diamond anim-float-delayed"></div>
      <div class="mt-20 diamond anim-float"></div>
      <div class="diamond anim-float-delayed"></div>
    </div>
  </div>

  <div class="absolute inset-0 block pointer-events-none dark:hidden">
    <div class="absolute flex gap-4 opacity-80 diamond-pos-left diamond-pos-top">
      <div class="diamond anim-float"></div>
      <div class="mt-20 diamond anim-float-delayed"></div>
      <div class="diamond anim-float"></div>
    </div>
    <div class="absolute flex flex-col gap-0 -translate-y-1/2 opacity-80 diamond-pos-right top-1/2">
      <div class="diamond anim-float-delayed"></div>
      <div class="diamond -mt-16 anim-float"></div>
      <div class="diamond -mt-16 anim-float-delayed"></div>
      <div class="diamond -mt-16 anim-float"></div>
    </div>
  </div>

  <div class="relative z-10 w-full p-0 mx-auto max-w-7xl md:p-0 -mt-16 md:-mt-24 2xl:-mt-32">
    <div class="flex flex-col items-center justify-center gap-4">
      <div class="flex flex-col items-center justify-center w-full px-4 sm:px-8">
        <img
          #logoLight
          class="block object-cover w-32 h-32 rounded-full dark:hidden sm:w-36 sm:h-36 md:w-48 md:h-48 lg:w-52 lg:h-52 2xl:w-60 2xl:h-60 drop-shadow-lg/25 relative z-10 animate-zoom-out-presence opacity-0-init"
          width="150"
          height="150"
          src="/assets/logo.png"
          [alt]="'general.logo.alt' | translate"
          (animationstart)="logoLight.classList.remove('opacity-0-init')"
        />

        <img
          #logoDark
          class="hidden object-cover w-32 h-32 rounded-full dark:block sm:w-36 sm:h-36 md:w-48 md:h-48 lg:w-52 lg:h-52 2xl:w-60 2xl:h-60 relative z-10 animate-zoom-out-presence opacity-0-init"
          width="150"
          height="150"
          src="/assets/logo_dark.png"
          [alt]="'general.logo.alt' | translate"
          (animationstart)="logoDark.classList.remove('opacity-0-init')"
        />

        <div
          #heroTitle
          class="-mt-4 md:-mt-6 2xl:-mt-10 relative z-20 animate-cinematic-title opacity-0-init delay-200"
          (animationstart)="heroTitle.classList.remove('opacity-0-init')"
        >
          <h1
            class="text-5xl md:text-8xl 2xl:text-[10rem] text-gold-shine pb-2 md:pb-4 leading-tight drop-shadow-sm"
          >
            Plato y Copa
          </h1>
        </div>

        <div
          #heroSubtitle
          class="animate-ethereal-rise opacity-0-init delay-300"
          (animationstart)="heroSubtitle.classList.remove('opacity-0-init')"
        >
          <span
            class="block text-base tracking-widest uppercase sm:text-lg md:text-2xl 2xl:text-4xl 2xl:mt-2 text-silver-shine"
          >
            Servicio de meseros
          </span>
        </div>

        <p
          #heroDesc
          class="mt-6 mb-8 px-6 sm:px-12 max-w-xl text-sm leading-relaxed text-center sm:text-base 2xl:text-2xl 2xl:mt-12 2xl:mb-12 text-gray-500 dark:text-gray-400 font-light tracking-wide animate-ethereal-rise opacity-0-init delay-400"
          (animationstart)="heroDesc.classList.remove('opacity-0-init')"
        >
          {{ 'home.description' | translate }}
        </p>
      </div>

      <div
        #heroBtns
        class="flex flex-col items-center justify-center w-full px-8 gap-5 sm:flex-row sm:w-auto sm:px-0 2xl:gap-8 z-20 relative animate-cta-reveal opacity-0-init delay-500"
        (animationstart)="heroBtns.classList.remove('opacity-0-init')"
      >
        <p-button
          class="w-full sm:w-auto"
          styleClass="!w-full sm:!w-auto !text-lg md:!text-xl 2xl:!text-4xl !px-8 sm:!px-10 !py-4 2xl:!py-8 bg-gold-shine !border-none  transition-all duration-700 ease-out hover:brightness-110 hover:-translate-y-1 hover:shadow-[0_15px_40px_rgba(226,200,125,0.3)] dark:hover:shadow-[0_15px_40px_rgba(226,200,125,0.2)]"
          [label]="'home.button.book' | translate"
          [rounded]="true"
        >
          <ng-template #icon>
            <i class="pi pi-calendar-clock !text-sm md:!text-lg xl:!text-xl 2xl:!text-3xl"></i>
          </ng-template>
        </p-button>

        <p-button
          class="w-full sm:w-auto"
          styleClass="!w-full sm:!w-auto !text-lg md:!text-xl 2xl:!text-4xl !px-8 sm:!px-10 !py-4 2xl:!py-8 !bg-gradient-to-br !from-white !via-[var(--p-primary-50)]/20 !to-[var(--p-primary-100)]/70 !backdrop-blur-2xl !border !border-gray-200/80 !text-[var(--p-primary-700)] dark:!from-black/95 dark:!via-neutral-950/90 dark:!to-[var(--p-primary-900)]/10 dark:!border-neutral-800/80 dark:!text-gold-shine transition-all duration-700 ease-out hover:-translate-y-1 hover:shadow-[0_15px_40px_rgba(226,200,125,0.2)] dark:hover:shadow-[0_15px_40px_rgba(226,200,125,0.15)] hover:border-[#e2c87d]/40 dark:hover:border-[#e2c87d]/30"
          variant="outlined"
          [label]="'home.button.contact' | translate"
          [rounded]="true"
        >
          <ng-template #icon>
            <i class="pi pi-envelope !text-sm md:!text-lg xl:!text-xl 2xl:!text-3xl"></i>
          </ng-template>
        </p-button>
      </div>
    </div>
  </div>
</section>
