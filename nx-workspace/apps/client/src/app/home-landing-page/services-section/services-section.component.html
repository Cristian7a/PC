<div
  id="services"
  class="scroll-mt-20 md:scroll-mt-28 relative flex flex-col justify-center w-full px-6 pt-0 py-2 md:py-4 2xl:py-8 mx-auto max-w-[2000px] sm:px-12 md:px-16 lg:px-24 z-10"
>
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[70%] h-[50%] bg-[var(--p-primary-500)] rounded-full filter blur-[100px] md:blur-[160px] opacity-[0.08] dark:opacity-[0.03] pointer-events-none z-0"
  ></div>

  <div
    #servicesHeader
    class="relative z-10 opacity-0-init flex flex-col items-center mb-8 md:mb-12 2xl:mb-16"
    pAnimateOnScroll
    enterClass="animate-services-header"
    [once]="true"
    (animationstart)="servicesHeader.classList.remove('opacity-0-init')"
  >
    <h2
      class="text-3xl font-light text-center tracking-tight text-gold-shine md:text-5xl 2xl:text-7xl"
    >
      {{ 'services.title' | translate }}
    </h2>
    <div
      class="w-24 md:w-32 h-[1px] mt-4 bg-gradient-to-r from-transparent via-[var(--p-primary-500)] to-transparent opacity-80"
    ></div>
    <span
      class="mt-4 text-[10px] font-bold text-center uppercase tracking-[0.4em] text-silver-shine md:text-xs 2xl:text-sm"
    >
      {{ 'services.subtitle' | translate }}
    </span>
    <p
      class="mt-6 text-sm font-light leading-relaxed text-center text-gray-600 max-w-2xl dark:text-gray-400 md:text-base 2xl:text-xl"
    >
      {{ 'services.description' | translate }}
    </p>
  </div>

  <div class="relative z-10 grid grid-cols-1 gap-1 md:grid-cols-2 lg:grid-cols-3 2xl:gap-6">
    @for (sv of services(); track sv.id) {
      <div
        #serviceCard
        class="opacity-0-init h-full service-card-wrapper"
        pAnimateOnScroll
        enterClass="animate-service-card"
        [once]="true"
        (animationstart)="serviceCard.classList.remove('opacity-0-init')"
      >
        <p-card
          styleClass="group relative overflow-hidden !bg-transparent !border-none !shadow-none !p-0 cursor-pointer transition-all duration-700 hover:-translate-y-2 hover:shadow-[0_20px_50px_rgba(0,0,0,0.2)]"
          (click)="showDialog(sv)"
        >
          <div
            class="relative w-full overflow-hidden transition-all duration-700 border border-gray-200/60 dark:border-white/10 shadow-lg aspect-[5/4] md:aspect-[4/3] rounded-[2rem] 2xl:rounded-[2.5rem] group-hover:border-[#e2c87d]/40 dark:group-hover:border-[#e2c87d]/30"
          >
            <img
              class="object-cover transition-transform duration-1000 ease-out group-hover:scale-110"
              fill
              sizes="(max-width: 768px) 100vw, (max-width: 1536px) 33vw, 25vw"
              [alt]="sv.name"
              [ngSrc]="imageUrl.getImageUrl(sv.image, '/assets/services/default.png')"
            />

            <div
              class="absolute inset-0 z-10 transition-opacity duration-700 bg-gradient-to-t from-slate-950/90 via-slate-900/20 to-transparent dark:from-black/95 dark:via-black/40 lg:opacity-100 lg:group-hover:opacity-0"
            ></div>
            <div
              class="absolute inset-0 z-10 transition-opacity duration-700 opacity-0 bg-gradient-to-t from-slate-950 via-slate-900/80 to-slate-900/20 dark:from-black dark:via-black/90 dark:to-black/30 lg:group-hover:opacity-100 backdrop-blur-[1px]"
            ></div>

            <div class="absolute z-20 top-4 right-4 md:top-5 md:right-5">
              <p-tag
                rounded="true"
                styleClass="!backdrop-blur-xl !bg-white/80 dark:!bg-black/60 !text-[var(--p-primary-700)] dark:!text-[var(--p-primary-300)] !font-bold !px-3 !py-1.5 !text-xs md:!text-sm 2xl:!text-lg shadow-lg border border-white/60 dark:border-white/10"
                [value]="'$' + sv.price"
              />
            </div>

            <div
              class="absolute inset-0 z-30 flex flex-col justify-end p-6 md:p-8 2xl:p-10 transition-all duration-500"
            >
              <div
                class="flex items-center gap-3 mb-2 2xl:gap-5 2xl:mb-4 transition-transform duration-500 group-hover:-translate-y-2"
              >
                <div
                  class="flex items-center justify-center w-8 h-8 md:w-10 md:h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/20"
                >
                  <i class="text-base md:text-lg text-[#e2c87d]" [class]="sv.icon"></i>
                </div>
                <h3
                  class="text-lg md:text-xl font-medium tracking-wide text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] 2xl:text-3xl"
                >
                  {{ sv.name }}
                </h3>
              </div>
              <div
                class="transition-all duration-500 overflow-hidden lg:h-0 lg:opacity-0 lg:group-hover:h-auto lg:group-hover:opacity-100 mt-3"
              >
                <p
                  class="mb-4 text-xs md:text-sm font-light leading-relaxed text-gray-200 line-clamp-2 2xl:text-lg"
                >
                  {{ sv.description }}
                </p>
                <div class="flex items-center w-full pr-2 gap-x-3 mt-auto">
                  <span
                    class="text-[10px] md:text-xs font-bold tracking-[0.25em] uppercase text-[#e2c87d]"
                  >
                    {{ 'general.learnMore' | translate }}
                  </span>
                  <p-divider class="flex-grow mx-1 before:!border-[#e2c87d]/40" />
                  <div
                    class="p-3 flex items-center justify-center w-7 h-7 md:w-8 md:h-8 rounded-full bg-[#e2c87d]/20 backdrop-blur-sm transition-all duration-300 group-hover:bg-[#e2c87d]"
                  >
                    <i
                      class="pi pi-arrow-right text-[10px] md:text-xs !text-white dark:!text-neutral-950"
                    ></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </p-card>
      </div>
    }
  </div>
</div>
<app-service-dialog
  [visible]="visible()"
  [service]="selectedService()"
  (closed)="visible.set(false)"
/>
