<div class="fixed right-4 top-1/3 flex flex-col gap-4 z-10">
  @for (social of socials; track social) {
    <a [href]="social.link" target="_blank" rel="noopener noreferrer" class="no-underline">
      <p-button
        rounded="true"
        raised="true"
        tooltipPosition="left"
        iconClass="text-!2xl md:!text-4xl"
        [icon]="social.icon"
        [pTooltip]="social.label"
        [styleClass]="
          social.brandClass +
          ' !w-10 !h-10 md:!w-12 md:!h-12 transition-all duration-300 hover:scale-110 active:scale-95 !text-white'
        "
      >
        <ng-template #icon>
          <i [class]="social.icon + ' !text-lg md:!text-xl'"></i>
        </ng-template>
      </p-button>
    </a>
  }
</div>
