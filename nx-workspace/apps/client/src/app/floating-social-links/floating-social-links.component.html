<div class="fixed right-4 top-1/3 flex flex-col gap-4 z-10">
  @for (social of socials; track social) {
    <a target="_blank" rel="noopener noreferrer" class="no-underline" [href]="social.link">
      <p-button
        rounded="true"
        raised="true"
        tooltipPosition="left"
        tooltipStyleClass="!text-xs md:!text-base 2xl:!text-4xl 2xl:p-1!"
        [pTooltip]="social.label"
        [styleClass]="
          social.brandClass +
          ' !w-10 !h-10 md:!w-12 md:!h-12 2xl:!w-24 2xl:!h-24 transition-all duration-300 hover:scale-110 active:scale-95 !text-white'
        "
      >
        <ng-template #icon>
          <i [class]="social.icon + ' !text-lg md:!text-xl 2xl:!text-5xl'"></i>
        </ng-template>
      </p-button>
    </a>
  }
</div>
