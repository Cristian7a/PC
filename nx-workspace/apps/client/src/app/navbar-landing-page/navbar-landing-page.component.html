<p-toolbar class="!py-2 md:!py-0 fixed z-50 w-full">
  <ng-template #start>
    <p-button variant="text" routerLink="/">
      <img
        alt="{{ 'general.logo.alt' | translate }}"
        ngSrc="/assets/logo.png"
        width="40"
        height="40"
        class="rounded-full object-cover mr-2 block dark:hidden drop-shadow-lg/25"
      />
      <img
        alt="{{ 'general.logo.alt' | translate }}"
        ngSrc="/assets/logo_dark.png"
        width="40"
        height="40"
        class="rounded-full object-cover mr-2 hidden dark:block"
      />
      <div class="hidden md:flex flex-col items-center">
        <h4 class="text-sm">Plato y Copa</h4>
        <span class="text-xs !text-[var(--p-text-color)]">Servicio de meseros</span>
      </div>
    </p-button>
  </ng-template>
  <ng-template #center>
    <div class="hidden lg:block">
      <p-tabs [value]="activeTab()">
        <p-tablist>
          @for (tab of tabs; track tab.fragment) {
            <p-tab
              class="flex items-center !gap-2 text-inherit"
              [value]="tab.fragment"
              [routerLink]="['/']"
              [fragment]="tab.fragment"
            >
              <i [class]="tab.icon"></i>
              <span>{{ tab.labelKey | translate }}</span>
            </p-tab>
          }
        </p-tablist>
      </p-tabs>
    </div>
  </ng-template>

  <ng-template #end>
    <div class="flex gap-2">
      <p-button
        icon="pi pi-search"
        variant="text"
        rounded="true"
        routerLink="/"
        tooltipPosition="bottom"
        [pTooltip]="'general.searchBtn' | translate"
      />
      <p-button
        label="{{ 'general.quotationBtn' | translate }}"
        icon="pi pi-calculator"
        rounded="true"
        class="hidden md:block"
      />
      <p-button
        icon="pi pi-calculator"
        rounded="true"
        class="block md:hidden"
        tooltipPosition="bottom"
        [pTooltip]="'general.quotationBtn' | translate"
      />
      <p-button
        [icon]="isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
        (click)="toggleTheme()"
        variant="text"
        rounded="true"
        tooltipPosition="bottom"
        [pTooltip]="'general.themeChangeBtn' | translate"
      />
    </div>
  </ng-template>
</p-toolbar>
